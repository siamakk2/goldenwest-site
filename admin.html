<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Golden West — Wholesale Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#0B2A45;--water:#1E7FB8;--amber:#E0A83A;--paper:#EEF3F6;--line:#D7E1E8;--muted:#5C6E7A;--ink:#12212E}
  *{box-sizing:border-box}
  body{margin:0;font-family:"IBM Plex Sans",sans-serif;color:var(--ink);background:var(--paper)}
  header.top{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:14px}
  header.top b{font-family:"Barlow Semi Condensed";font-size:1.3rem}
  header.top .sp{margin-left:auto;font-size:.9rem;color:#c8d6e0}
  .wrap{max-width:1080px;margin:0 auto;padding:24px}
  .btn{font-family:"Barlow Semi Condensed";font-weight:600;border:1.5px solid transparent;border-radius:9px;padding:.5em 1em;cursor:pointer;font-size:.95rem}
  .amber{background:var(--amber);color:var(--navy)} .water{background:var(--water);color:#fff}
  .out{background:#fff;border-color:var(--line);color:var(--navy)} .red{background:#fff;border-color:#e7b4b4;color:#a12626}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
  .login{max-width:380px;margin:60px auto}
  .login input{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:.7em .8em;margin:6px 0 12px;font-size:1rem}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tabs button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:.5em 1.1em;cursor:pointer;font-family:"Barlow Semi Condensed";font-weight:600}
  .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-family:"Barlow Semi Condensed";color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
  .pill{font-family:"IBM Plex Mono";font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px}
  .p-pending{background:#fff7e6;color:#8a6114} .p-approved{background:#e8f5ec;color:#1c6b39} .p-rejected{background:#fdecec;color:#a12626}
  .p-paid{background:#e8f5ec;color:#1c6b39} .p-fulfilled{background:#e6f0f7;color:#166;} .p-cancelled{background:#eee;color:#666}
  .msg{padding:11px 13px;border-radius:9px;margin:10px 0;display:none}
  .msg.err{display:block;background:#fdecec;border:1px solid #f3c3c3;color:#a12626}
  .muted{color:var(--muted);font-size:.85rem}
  h2{font-family:"Barlow Semi Condensed";color:var(--navy);margin:0 0 4px}
  .items{font-family:"IBM Plex Mono";font-size:.8rem;color:var(--muted);white-space:pre-line}
</style>
</head>
<body>
<header class="top"><b>Golden West</b> <span>Wholesale Admin</span><span class="sp" id="who"></span></header>

<div id="loginView" class="login" style="display:none">
  <div class="card">
    <h2>Owner sign in</h2>
    <div class="msg" id="lmsg"></div>
    <label>Email</label><input id="email" type="email" value="admin@goldenwestchem.com">
    <label>Password</label><input id="pass" type="password">
    <button class="btn amber" id="loginBtn" style="width:100%">Sign in</button>
  </div>
</div>

<div id="appView" class="wrap" style="display:none">
  <div class="tabs">
    <button data-tab="requests" class="on">Wholesale requests <span id="reqN"></span></button>
    <button data-tab="orders">Orders <span id="ordN"></span></button>
  </div>
  <div class="msg" id="amsg"></div>
  <div id="requests"></div>
  <div id="orders" style="display:none"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script>
const cfg = window.GW_CONFIG;
const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
const $ = (s)=>document.querySelector(s);
const money = (c)=>"$"+(Number(c||0)/100).toFixed(2);
const esc = (s)=>String(s==null?"":s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const fmt = (d)=> d ? new Date(d).toLocaleString() : "";

async function boot(){
  const { data } = await sb.auth.getSession();
  if(data.session){ await enter(); } else { $("#loginView").style.display="block"; }
}
$("#loginBtn").onclick = async ()=>{
  const m=$("#lmsg"); m.className="msg";
  const { error } = await sb.auth.signInWithPassword({ email:$("#email").value.trim().toLowerCase(), password:$("#pass").value });
  if(error){ m.className="msg err"; m.textContent=error.message; return; }
  await enter();
};
async function enter(){
  const { data:adm } = await sb.rpc("is_admin");
  if(!adm){ $("#lmsg").className="msg err"; $("#lmsg").textContent="This login is not an admin."; $("#loginView").style.display="block"; return; }
  const { data:{ session } } = await sb.auth.getSession();
  $("#who").textContent = session.user.email;
  $("#loginView").style.display="none"; $("#appView").style.display="block";
  loadRequests(); loadOrders();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  const t=b.dataset.tab; $("#requests").style.display = t==="requests"?"block":"none"; $("#orders").style.display = t==="orders"?"block":"none";
});

async function loadRequests(){
  const { data, error } = await sb.from("wholesale_accounts").select("*").order("created_at",{ascending:false});
  if(error){ showErr(error.message); return; }
  const pending = data.filter(r=>r.status==="pending");
  $("#reqN").textContent = pending.length ? "("+pending.length+")" : "";
  $("#requests").innerHTML = `<div class="card"><h2>Wholesale accounts</h2>
    <table><thead><tr><th>Business</th><th>Contact</th><th>Type</th><th>Location</th><th>Status</th><th>Requested</th><th></th></tr></thead>
    <tbody>${data.map(rowReq).join("")||`<tr><td colspan=7 class=muted>No requests yet.</td></tr>`}</tbody></table></div>`;
  bindReq();
}
function rowReq(r){
  const act = r.status==="pending"
    ? `<button class="btn water" data-app="${r.id}">Approve</button> <button class="btn red" data-rej="${r.id}">Reject</button>`
    : (r.status==="approved" ? `<button class="btn out" data-rej="${r.id}">Revoke</button>` : `<button class="btn water" data-app="${r.id}">Approve</button>`);
  return `<tr><td><b>${esc(r.business_name)}</b><br><span class="muted">${esc(r.email)} · ${esc(r.phone||"")}</span></td>
    <td>${esc(r.contact_name||"")}</td><td>${esc(r.business_type||"")}</td><td>${esc(r.city_state||"")} ${esc(r.zip||"")}</td>
    <td><span class="pill p-${r.status}">${r.status}</span></td><td class="muted">${fmt(r.created_at)}</td><td>${act}</td></tr>`;
}
function bindReq(){
  document.querySelectorAll("[data-app]").forEach(b=>b.onclick=()=>setStatus(b.dataset.app,"approved"));
  document.querySelectorAll("[data-rej]").forEach(b=>b.onclick=()=>setStatus(b.dataset.rej,"rejected"));
}
async function setStatus(id,status){
  const patch = { status }; if(status==="approved") patch.approved_at = new Date().toISOString();
  const { error } = await sb.from("wholesale_accounts").update(patch).eq("id",id);
  if(error) return showErr(error.message);
  loadRequests();
}

async function loadOrders(){
  const { data, error } = await sb.from("orders")
    .select("*, wholesale_accounts(business_name,email), order_items(product_name,sku,qty,unit_price_cents)")
    .order("created_at",{ascending:false});
  if(error){ showErr(error.message); return; }
  const open = data.filter(o=>o.status==="pending");
  $("#ordN").textContent = open.length ? "("+open.length+")" : "";
  $("#orders").innerHTML = `<div class="card"><h2>Orders</h2>
    <table><thead><tr><th>Business</th><th>Items</th><th>Subtotal</th><th>Status</th><th>Placed</th><th></th></tr></thead>
    <tbody>${data.map(rowOrd).join("")||`<tr><td colspan=6 class=muted>No orders yet.</td></tr>`}</tbody></table></div>`;
  document.querySelectorAll("[data-ful]").forEach(b=>b.onclick=()=>ordStatus(b.dataset.ful,"fulfilled"));
  document.querySelectorAll("[data-paid]").forEach(b=>b.onclick=()=>ordStatus(b.dataset.paid,"paid"));
  document.querySelectorAll("[data-can]").forEach(b=>b.onclick=()=>ordStatus(b.dataset.can,"cancelled"));
}
function rowOrd(o){
  const acct = o.wholesale_accounts ? o.wholesale_accounts.business_name : "—";
  const items = (o.order_items||[]).map(i=>`${i.qty}× ${i.product_name} @ ${money(i.unit_price_cents)}`).join("\n");
  return `<tr><td><b>${esc(acct)}</b><br><span class="muted">${esc(o.wholesale_accounts?o.wholesale_accounts.email:"")}</span></td>
    <td class="items">${esc(items)}</td><td><b>${money(o.subtotal_cents)}</b></td>
    <td><span class="pill p-${o.status}">${o.status}</span></td><td class="muted">${fmt(o.created_at)}</td>
    <td>${o.status==="pending"?`<button class="btn water" data-paid="${o.id}">Mark paid</button> <button class="btn out" data-ful="${o.id}">Fulfilled</button> <button class="btn red" data-can="${o.id}">Cancel</button>`:(o.status==="paid"?`<button class="btn out" data-ful="${o.id}">Fulfilled</button>`:"")}</td></tr>`;
}
async function ordStatus(id,status){
  const { error } = await sb.from("orders").update({status}).eq("id",id);
  if(error) return showErr(error.message);
  loadOrders();
}
function showErr(t){ const m=$("#amsg"); m.className="msg err"; m.textContent=t; }
boot();
</script>
</body>
</html>
