<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Golden West — Wholesale Admin</title>
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/gw-icon-32.png" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#0B2A45;--water:#1E7FB8;--amber:#E0A83A;--paper:#EEF3F6;--line:#D7E1E8;--muted:#5C6E7A;--ink:#12212E}
  *{box-sizing:border-box}
  body{margin:0;font-family:"IBM Plex Sans",sans-serif;color:var(--ink);background:var(--paper)}
  header.top{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:14px}
  header.top b{font-family:"Barlow Semi Condensed";font-size:1.3rem}
  header.top .sp{margin-left:auto;font-size:.9rem;color:#c8d6e0}
  .wrap{max-width:1080px;margin:0 auto;padding:24px}
  .btn{font-family:"Barlow Semi Condensed";font-weight:600;border:1.5px solid transparent;border-radius:9px;padding:.5em 1em;cursor:pointer;font-size:.95rem}
  .amber{background:var(--amber);color:var(--navy)} .water{background:var(--water);color:#fff}
  .out{background:#fff;border-color:var(--line);color:var(--navy)} .red{background:#fff;border-color:#e7b4b4;color:#a12626}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
  .login{max-width:380px;margin:60px auto}
  .login input{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:.7em .8em;margin:6px 0 12px;font-size:1rem}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tabs button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:.5em 1.1em;cursor:pointer;font-family:"Barlow Semi Condensed";font-weight:600}
  .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-family:"Barlow Semi Condensed";color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
  .pill{font-family:"IBM Plex Mono";font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px}
  .p-pending{background:#fff7e6;color:#8a6114} .p-approved{background:#e8f5ec;color:#1c6b39} .p-rejected{background:#fdecec;color:#a12626}
  .p-paid{background:#e8f5ec;color:#1c6b39} .p-fulfilled{background:#e6f0f7;color:#166;} .p-cancelled{background:#eee;color:#666}
  .msg{padding:11px 13px;border-radius:9px;margin:10px 0;display:none}
  .msg.err{display:block;background:#fdecec;border:1px solid #f3c3c3;color:#a12626}
  .msg.ok{display:block;background:#e8f5ec;border:1px solid #b9e0c6;color:#1c6b39}
  .muted{color:var(--muted);font-size:.85rem}
  h2{font-family:"Barlow Semi Condensed";color:var(--navy);margin:0 0 4px}
  .items{font-family:"IBM Plex Mono";font-size:.8rem;color:var(--muted);white-space:pre-line}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .toolbar .search{flex:1;min-width:200px;border:1.5px solid var(--line);border-radius:9px;padding:.55em .8em;font-size:.95rem}
  .prod{display:grid;grid-template-columns:92px 1.2fr 1.15fr auto;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;align-items:start}
  .prod .thbox{display:flex;flex-direction:column;gap:6px;align-items:center}
  .prod img.th,.prod .noimg{width:88px;height:88px;object-fit:contain;background:#f4f7f9;border:1px solid var(--line);border-radius:8px}
  .prod .noimg{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.65rem;text-align:center}
  .prod .upl{font-size:.72rem;color:var(--water);cursor:pointer;text-decoration:underline;font-family:"Barlow Semi Condensed";font-weight:600}
  .prod input[type=file]{display:none}
  #newProd{display:none}
  .szbox{grid-column:1 / -1;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  .szbox h4{font-family:"Barlow Semi Condensed";font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
  .szfull{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:10px}
  .szrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
  .szrow input[type=text][data-sz="size"]{flex:1;min-width:150px}
  .szrow .in{flex:none}
  .szrow .in input{width:118px;min-width:118px;font-size:.95rem;padding:.5em .55em}
  .szrow .tog{white-space:nowrap;font-size:.74rem}
  .szhead{display:flex;gap:10px;color:#8aa0af;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin:4px 0 2px}
  .szhead b:first-child{flex:1;min-width:150px}.szhead b{width:128px;font-weight:700}
  @media(max-width:860px){
    .prod{grid-template-columns:1fr !important}
    .prod input.pin,.prod textarea.pin,.szrow input{font-size:16px !important;padding:.55em .6em}
    .szrow .in input{font-size:16px}
    .thbox{max-width:180px}
  }
  .szrow input[type=text]{border:1.5px solid var(--line);border-radius:7px;padding:.4em .5em;font-size:.85rem}
  .szrow .in{display:flex;align-items:center;gap:4px}
  .szrow .in input{width:100%;border:1.5px solid var(--line);border-radius:7px;padding:.4em .5em;font-size:.85rem}
  .szrow .del{background:none;border:0;color:#a12626;cursor:pointer;font-size:1rem}
  .szadd{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .szadd button{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:.3em .8em;font-size:.75rem;cursor:pointer;font-family:"Barlow Semi Condensed";font-weight:600;color:var(--navy)}
  #newProd .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  #newProd label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:8px 0 2px;font-family:"Barlow Semi Condensed"}
  #newProd input,#newProd select{width:100%;border:1.5px solid var(--line);border-radius:7px;padding:.45em .55em;font-size:.9rem;font-family:"IBM Plex Sans"}
  .prod label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:8px 0 2px;font-family:"Barlow Semi Condensed"}
  .prod input.pin,.prod textarea.pin{width:100%;border:1.5px solid var(--line);border-radius:7px;padding:.4em .5em;font-size:.86rem;font-family:"IBM Plex Sans"}
  .prod textarea.pin{resize:vertical;min-height:36px;font-size:.8rem}
  .prod .sm{width:84px}
  .prod .meta{font-family:"IBM Plex Mono";font-size:.72rem;color:var(--muted);margin-top:4px}
  .prod .in{display:flex;align-items:center;gap:4px}
  .prod .act{display:flex;flex-direction:column;gap:8px;min-width:118px}
  .tog{display:flex;align-items:center;gap:6px;font-size:.82rem;cursor:pointer;user-select:none}
  .tog input{width:16px;height:16px}
</style>
</head>
<body>
<header class="top"><b>Golden West</b> <span>Wholesale Admin</span><span class="sp" id="who"></span></header>

<div id="loginView" class="login" style="display:none">
  <div class="card">
    <h2>Owner sign in</h2>
    <div class="msg" id="lmsg"></div>
    <label>Email</label><input id="email" type="email" placeholder="oscar@goldenwestchem.com">
    <label>Password</label><input id="pass" type="password">
    <button class="btn amber" id="loginBtn" style="width:100%">Sign in</button>
  </div>
</div>

<div id="appView" class="wrap" style="display:none">
  <div class="tabs">
    <button data-tab="products" class="on">Products</button>
    <button data-tab="requests">Wholesale requests <span id="reqN"></span></button>
    <button data-tab="orders">Wholesale orders <span id="ordN"></span></button>
    <button data-tab="retail">Retail orders <span id="rordN"></span></button>
    <button data-tab="freight">Freight</button>
  </div>
  <div class="msg" id="amsg"></div>
  <div id="products">
    <div class="toolbar"><input class="search" id="prodSearch" placeholder="Search products by name or SKU…"><button class="btn water" id="newProdBtn">+ New product</button><span class="muted" id="prodCount"></span></div>
    <div class="card" id="newProd">
      <h2>New product</h2>
      <div class="grid2">
        <div><label>Name (EN) *</label><input id="np_name_en"></div>
        <div><label>Name (ES)</label><input id="np_name_es"></div>
        <div><label>SKU</label><input id="np_sku"></div>
        <div><label>Category</label><select id="np_cat"></select></div>
        <div><label>Wholesale price ($)</label><input id="np_price" inputmode="decimal"></div>
        <div><label>Retail price ($)</label><input id="np_retail" inputmode="decimal"></div>
        <div><label>Unit (e.g. 1 Gallon, Each)</label><input id="np_unit"></div>
        <div><label>Min order qty</label><input id="np_moq" value="1" inputmode="numeric"></div>
      </div>
      <div style="margin-top:14px;display:flex;gap:10px">
        <button class="btn amber" id="np_create">Create product</button>
        <button class="btn out" id="np_cancel">Cancel</button>
      </div>
      <p class="muted" style="margin:10px 0 0">After creating, use “Upload image” on the product card to add its photo.</p>
    </div>
    <div id="prodList"><div class="muted" style="padding:16px 0">Loading products…</div></div>
  </div>
  <div id="requests" style="display:none"></div>
  <div id="orders" style="display:none"></div>
  <div id="retail" style="display:none"></div>
  <div id="freight" style="display:none"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js?v=9"></script>
<script>
const cfg = window.GW_CONFIG;
const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
const $ = (s)=>document.querySelector(s);
const money = (c)=>"$"+(Number(c||0)/100).toFixed(2);
const esc = (s)=>String(s==null?"":s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const fmt = (d)=> d ? new Date(d).toLocaleString() : "";

async function boot(){
  const { data } = await sb.auth.getSession();
  if(data.session){ await enter(); } else { $("#loginView").style.display="block"; }
}
$("#loginBtn").onclick = async ()=>{
  const m=$("#lmsg"); m.className="msg";
  const { error } = await sb.auth.signInWithPassword({ email:$("#email").value.trim().toLowerCase(), password:$("#pass").value });
  if(error){ m.className="msg err"; m.textContent=error.message; return; }
  await enter();
};
async function enter(){
  const { data:adm } = await sb.rpc("is_admin");
  if(!adm){ $("#lmsg").className="msg err"; $("#lmsg").textContent="This login is not an admin."; $("#loginView").style.display="block"; return; }
  const { data:{ session } } = await sb.auth.getSession();
  $("#who").textContent = session.user.email;
  $("#loginView").style.display="none"; $("#appView").style.display="block";
  loadProducts(); loadRequests(); loadOrders(); loadRetail(); loadFreight();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  const t=b.dataset.tab;
  ["products","requests","orders","retail","freight"].forEach(k=>{ $("#"+k).style.display = (k===t)?"block":"none"; });
});

async function loadRequests(){
  const [{ data, error }, { data:qs, error:qe }] = await Promise.all([
    sb.from("wholesale_accounts").select("*").order("created_at",{ascending:false}),
    sb.from("quote_requests").select("*").order("created_at",{ascending:false})
  ]);
  if(error){ showErr(error.message); return; }
  if(qe){ showErr(qe.message); }
  const pending = data.filter(r=>r.status==="pending");
  const newQ = (qs||[]).filter(q=>q.status==="new");
  $("#reqN").textContent = (pending.length+newQ.length) ? "("+(pending.length+newQ.length)+")" : "";
  $("#requests").innerHTML = `<div class="card"><h2>Pricing requests</h2>
    <table><thead><tr><th>Business</th><th>Contact</th><th>Interested in</th><th>Status</th><th>Received</th><th></th></tr></thead>
    <tbody>${(qs||[]).map(rowQuote).join("")||`<tr><td colspan=6 class=muted>No pricing requests yet.</td></tr>`}</tbody></table></div>
    <div class="card"><h2>Wholesale accounts</h2>
    <table><thead><tr><th>Business</th><th>Contact</th><th>Type</th><th>Location</th><th>Status</th><th>Requested</th><th></th></tr></thead>
    <tbody>${data.map(rowReq).join("")||`<tr><td colspan=7 class=muted>No requests yet.</td></tr>`}</tbody></table></div>`;
  bindReq();
  document.querySelectorAll("[data-qdone]").forEach(b=>b.onclick=()=>qStatus(b.dataset.qdone,"handled"));
  document.querySelectorAll("[data-qnew]").forEach(b=>b.onclick=()=>qStatus(b.dataset.qnew,"new"));
}
function rowQuote(q){
  const meta=[q.business_type,q.city_state,q.zip,q.volume].filter(Boolean).join(" · ");
  return `<tr><td><b>${esc(q.business||"—")}</b>${meta?`<br><span class="muted">${esc(meta)}</span>`:""}</td>
    <td>${esc(q.contact_name||"—")}<br><span class="muted">${esc(q.email||"")}${q.phone?" · "+esc(q.phone):""}</span></td>
    <td class="items">${esc(q.products||"—")}${q.message?`<br><span class="muted">${esc(q.message)}</span>`:""}</td>
    <td><span class="pill p-${q.status==="new"?"pending":"approved"}">${q.status}</span></td>
    <td class="muted">${fmt(q.created_at)}</td>
    <td>${q.status==="new"?`<button class="btn water" data-qdone="${q.id}">Mark handled</button>`:`<button class="btn out" data-qnew="${q.id}">Reopen</button>`}</td></tr>`;
}
async function qStatus(id,status){
  const { error } = await sb.from("quote_requests").update({status}).eq("id",id);
  if(error) return showErr(error.message);
  loadRequests();
}
function rowReq(r){
  const act = r.status==="pending"
    ? `<button class="btn water" data-app="${r.id}">Approve</button> <button class="btn red" data-rej="${r.id}">Reject</button>`
    : (r.status==="approved" ? `<button class="btn out" data-rej="${r.id}">Revoke</button>` : `<button class="btn water" data-app="${r.id}">Approve</button>`);
  return `<tr><td><b>${esc(r.business_name)}</b><br><span class="muted">${esc(r.email)} · ${esc(r.phone||"")}</span></td>
    <td>${esc(r.contact_name||"")}</td><td>${esc(r.business_type||"")}</td><td>${esc(r.city_state||"")} ${esc(r.zip||"")}</td>
    <td><span class="pill p-${r.status}">${r.status}</span></td><td class="muted">${fmt(r.created_at)}</td><td>${act}</td></tr>`;
}
function bindReq(){
  document.querySelectorAll("[data-app]").forEach(b=>b.onclick=()=>setStatus(b.dataset.app,"approved"));
  document.querySelectorAll("[data-rej]").forEach(b=>b.onclick=()=>setStatus(b.dataset.rej,"rejected"));
}
async function setStatus(id,status){
  const patch = { status }; if(status==="approved") patch.approved_at = new Date().toISOString();
  const { error } = await sb.from("wholesale_accounts").update(patch).eq("id",id);
  if(error) return showErr(error.message);
  loadRequests();
}

async function loadOrders(){
  const { data, error } = await sb.from("orders")
    .select("*, wholesale_accounts(business_name,email), order_items(product_name,sku,qty,unit_price_cents)")
    .order("created_at",{ascending:false});
  if(error){ showErr(error.message); return; }
  const open = data.filter(o=>o.status==="pending");
  $("#ordN").textContent = open.length ? "("+open.length+")" : "";
  $("#orders").innerHTML = `<div class="card"><h2>Orders</h2>
    <table><thead><tr><th>Business</th><th>Items</th><th>Subtotal</th><th>Status</th><th>Placed</th><th></th></tr></thead>
    <tbody>${data.map(rowOrd).join("")||`<tr><td colspan=6 class=muted>No orders yet.</td></tr>`}</tbody></table></div>`;
  document.querySelectorAll("[data-ful]").forEach(b=>b.onclick=()=>ordStatus(b.dataset.ful,"fulfilled"));
  document.querySelectorAll("[data-paid]").forEach(b=>b.onclick=()=>ordStatus(b.dataset.paid,"paid"));
  document.querySelectorAll("[data-can]").forEach(b=>b.onclick=()=>ordStatus(b.dataset.can,"cancelled"));
}
function rowOrd(o){
  const acct = o.wholesale_accounts ? o.wholesale_accounts.business_name : "—";
  const items = (o.order_items||[]).map(i=>`${i.qty}× ${i.product_name} @ ${money(i.unit_price_cents)}`).join("\n");
  return `<tr><td><b>${esc(acct)}</b><br><span class="muted">${esc(o.wholesale_accounts?o.wholesale_accounts.email:"")}</span></td>
    <td class="items">${esc(items)}</td><td><b>${money(o.subtotal_cents)}</b></td>
    <td><span class="pill p-${o.status}">${o.status}</span></td><td class="muted">${fmt(o.created_at)}</td>
    <td>${o.status==="pending"?`<button class="btn water" data-paid="${o.id}">Mark paid</button> <button class="btn out" data-ful="${o.id}">Fulfilled</button> <button class="btn red" data-can="${o.id}">Cancel</button>`:(o.status==="paid"?`<button class="btn out" data-ful="${o.id}">Fulfilled</button>`:"")}</td></tr>`;
}
async function ordStatus(id,status){
  const { error } = await sb.from("orders").update({status}).eq("id",id);
  if(error) return showErr(error.message);
  loadOrders();
}

async function loadRetail(){
  const { data, error } = await sb.from("retail_orders")
    .select("*, retail_order_items(product_name,size,qty,unit_price_cents)")
    .order("created_at",{ascending:false});
  if(error){ showErr(error.message); return; }
  const open = data.filter(o=>o.status==="pending");
  $("#rordN").textContent = open.length ? "("+open.length+")" : "";
  $("#retail").innerHTML = `<div class="card"><h2>Retail orders</h2>
    <table><thead><tr><th>Customer</th><th>Items</th><th>Subtotal</th><th>Status</th><th>Placed</th><th></th></tr></thead>
    <tbody>${data.map(rowRet).join("")||`<tr><td colspan=6 class=muted>No retail orders yet.</td></tr>`}</tbody></table></div>`;
  document.querySelectorAll("[data-rful]").forEach(b=>b.onclick=()=>retStatus(b.dataset.rful,"fulfilled"));
  document.querySelectorAll("[data-rpaid]").forEach(b=>b.onclick=()=>retStatus(b.dataset.rpaid,"paid"));
  document.querySelectorAll("[data-rcan]").forEach(b=>b.onclick=()=>retStatus(b.dataset.rcan,"cancelled"));
}
function rowRet(o){
  const items = (o.retail_order_items||[]).map(i=>`${i.qty}× ${i.product_name}${i.size?" ("+i.size+")":""} @ ${money(i.unit_price_cents)}`).join("\n");
  return `<tr><td><b>${esc(o.customer_name)}</b><br><span class="muted">${esc(o.email||"")}${o.phone?" · "+esc(o.phone):""}</span><br><span class="muted">${esc(o.address||"")}${o.zip?" "+esc(o.zip):""}</span></td>
    <td class="items">${esc(items)}</td><td><b>${money(o.subtotal_cents + (o.freight_cents||0))}</b>${o.freight_cents?`<br><span class="muted">incl. ${money(o.freight_cents)} freight</span>`:""}</td>
    <td><span class="pill p-${o.status}">${o.status}</span></td><td class="muted">${fmt(o.created_at)}</td>
    <td>${o.status==="pending"?`<button class="btn water" data-rpaid="${o.id}">Mark paid</button> <button class="btn out" data-rful="${o.id}">Fulfilled</button> <button class="btn red" data-rcan="${o.id}">Cancel</button>`:(o.status==="paid"?`<button class="btn out" data-rful="${o.id}">Fulfilled</button>`:"")}</td></tr>`;
}
async function retStatus(id,status){
  const { error } = await sb.from("retail_orders").update({status}).eq("id",id);
  if(error) return showErr(error.message);
  loadRetail();
}

/* ---------- freight rules ---------- */
async function loadFreight(){
  const [{ data, error }, { data:tiers }] = await Promise.all([
    sb.from("freight_rules").select("*").order("zip_prefix"),
    sb.from("shipping_tiers").select("*").order("max_lb")
  ]);
  if(error){ showErr(error.message); return; }
  $("#freight").innerHTML = `<div class="card"><h2>Freight by ZIP code</h2>
    <p class="muted" style="margin:0 0 14px">Delivery charge = <b>base fee</b> + <b>per-gallon rate</b> × total gallons in the order. The most specific ZIP prefix wins ("90" beats "9"). Set "free over" to give free delivery above a subtotal. If no rule matches a customer's ZIP, the order still goes through and freight is quoted by phone.</p>
    <table><thead><tr><th>ZIP starts with</th><th>Area label</th><th>Base fee</th><th>Per gallon</th><th>Free over</th><th>Active</th><th></th></tr></thead>
    <tbody id="frRows">${(data||[]).map(frRow).join("")||`<tr><td colspan=7 class=muted>No freight rules yet — retail checkout shows "quoted after order" until you add one.</td></tr>`}</tbody></table>
    <div style="margin-top:14px;display:flex;gap:10px">
      <button class="btn water" id="frAdd">+ Add rule</button>
      <button class="btn amber" id="frSave">Save freight rules</button>
    </div></div>
    <div class="card"><h2>National shipping (UPS estimate, by weight)</h2>
    <p class="muted" style="margin:0 0 14px">For orders <b>outside</b> your ZIP rules above. The customer pays the price of the smallest tier that fits the order's total shipping weight. Orders heavier than the last tier — or any drum, tote, or restricted item — check out as <b>"freight confirmed within 1 business day."</b></p>
    <table style="max-width:420px"><thead><tr><th>Up to (lb)</th><th>Price</th><th></th></tr></thead>
    <tbody id="stRows">${(tiers||[]).map(stRow).join("")||""}</tbody></table>
    <div style="margin-top:14px;display:flex;gap:10px">
      <button class="btn water" id="stAdd">+ Add tier</button>
      <button class="btn amber" id="stSave">Save shipping tiers</button>
    </div></div>`;
  $("#stAdd").onclick=()=>{ $("#stRows").insertAdjacentHTML("beforeend", stRow({max_lb:"",price_cents:0})); $("#stRows").lastElementChild.querySelector(".del").onclick=(e)=>e.target.closest("tr").remove(); };
  $("#stSave").onclick=saveTiers;
  document.querySelectorAll("#stRows .del").forEach(b=>b.onclick=()=>b.closest("tr").remove());
  $("#frAdd").onclick=()=>{
    const tb=$("#frRows"); const ph=tb.querySelector(".muted"); if(ph) ph.closest("tr").remove();
    tb.insertAdjacentHTML("beforeend", frRow({zip_prefix:"",label:"",base_cents:0,per_gallon_cents:0,free_over_cents:null,active:true}));
    tb.lastElementChild.querySelector(".del").onclick=(e)=>e.target.closest("tr").remove();
  };
  $("#frSave").onclick=saveFreight;
  document.querySelectorAll("#frRows .del").forEach(b=>b.onclick=()=>b.closest("tr").remove());
}
function stRow(r){
  return `<tr><td><input data-st="lb" inputmode="decimal" value="${r.max_lb!=null?r.max_lb:""}" style="width:90px"></td>
    <td><div class="in"><span>$</span><input data-st="p" inputmode="decimal" value="${r.price_cents!=null?(r.price_cents/100).toFixed(2):""}" style="width:90px"></div></td>
    <td><button type="button" class="del" style="background:none;border:0;color:#a12626;cursor:pointer">\u2715</button></td></tr>`;
}
async function saveTiers(){
  const rows=[...document.querySelectorAll("#stRows tr")]; const ups=[];
  for(const tr of rows){
    const lb=parseFloat(tr.querySelector('[data-st="lb"]').value.replace(/[^0-9.]/g,""));
    const p=moneyCents(tr.querySelector('[data-st="p"]').value);
    if(!lb||p===null){ showErr("Each tier needs a weight and a price."); return; }
    ups.push({max_lb:lb, price_cents:p, active:true});
  }
  const { error:de } = await sb.from("shipping_tiers").delete().gte("id",0);
  if(de) return showErr(de.message);
  if(ups.length){ const { error:ie } = await sb.from("shipping_tiers").insert(ups); if(ie) return showErr(ie.message); }
  const m=$("#amsg"); m.className="msg ok"; m.textContent="Shipping tiers saved."; setTimeout(()=>{ if(m.className.includes("ok")) m.className="msg"; },3000);
  loadFreight();
}
function frRow(r){
  return `<tr data-frid="${r.id||""}">
    <td><input data-fr="zip" value="${escA(r.zip_prefix||"")}" style="width:90px" placeholder="e.g. 902"></td>
    <td><input data-fr="label" value="${escA(r.label||"")}" placeholder="e.g. LA / South Bay"></td>
    <td><div class="in"><span>$</span><input data-fr="base" inputmode="decimal" value="${(r.base_cents||0)/100 ? ((r.base_cents||0)/100).toFixed(2) : (r.base_cents===0?"0.00":"")}" style="width:80px"></div></td>
    <td><div class="in"><span>$</span><input data-fr="pg" inputmode="decimal" value="${((r.per_gallon_cents||0)/100).toFixed(2)}" style="width:80px"></div></td>
    <td><div class="in"><span>$</span><input data-fr="free" inputmode="decimal" value="${r.free_over_cents!=null?(r.free_over_cents/100).toFixed(2):""}" placeholder="—" style="width:90px"></div></td>
    <td><label class="tog"><input type="checkbox" data-fr="active" ${r.active===false?"":"checked"}></label></td>
    <td><button type="button" class="del" style="background:none;border:0;color:#a12626;cursor:pointer">✕</button></td>
  </tr>`;
}
async function saveFreight(){
  const rows=[...document.querySelectorAll("#frRows tr[data-frid]")];
  const ups=[];
  for(const tr of rows){
    const v=(k)=>tr.querySelector(`[data-fr="${k}"]`).value.trim();
    const zip=v("zip").replace(/\D/g,"");
    if(!zip){ showErr("Every rule needs a ZIP prefix (1–5 digits)."); return; }
    const free=v("free");
    ups.push({ zip_prefix:zip, label:v("label")||null,
      base_cents:Math.round(parseFloat(v("base")||"0")*100)||0,
      per_gallon_cents:Math.round(parseFloat(v("pg")||"0")*100)||0,
      free_over_cents: free===""?null:Math.round(parseFloat(free)*100),
      active: tr.querySelector('[data-fr="active"]').checked });
  }
  const btn=$("#frSave"); btn.disabled=true; btn.textContent="Saving…";
  const { error:de } = await sb.from("freight_rules").delete().gte("created_at","1970-01-01");
  if(de){ btn.disabled=false; btn.textContent="Save freight rules"; showErr(de.message); return; }
  if(ups.length){
    const { error:ie } = await sb.from("freight_rules").insert(ups);
    if(ie){ btn.disabled=false; btn.textContent="Save freight rules"; showErr(ie.message); return; }
  }
  btn.disabled=false; btn.textContent="Save freight rules";
  const m=$("#amsg"); m.className="msg ok"; m.textContent="Freight rules saved — live on the site immediately."; setTimeout(()=>{ if(m.className.includes("ok")) m.className="msg"; },4000);
  loadFreight();
}
let PRODUCTS=[];
const escA=(s)=>String(s==null?"":s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const priceOf=(p)=>{ const v=p.product_prices; return Array.isArray(v) ? (v[0]||null) : (v||null); };
const retailOf=(p)=>{ const v=p.product_retail; return Array.isArray(v) ? (v[0]||null) : (v||null); };
const gal=(s)=>{ const m=/([\d.]+)\s*gal/i.exec(s||""); return m?parseFloat(m[1]):999; };
const LIQUID_CATS=["chemical-products","by-gallon","express-tunnel","waxes-compounds","finishing-touches","3m-ps-malco-and-stoner-car-care"];
function isLiquid(p){
  if(LIQUID_CATS.includes(p.category_id)) return true;
  const t=((p.name_en||"")+" "+((priceOf(p)||{}).unit||"")).toLowerCase();
  return /gallon|degreaser|shampoo|soap|cleaner|polish|wax|dressing|shine|sealant|solvent|compound/.test(t);
}
function szChips(p){ return isLiquid(p) ? ["1 Gallon","5 Gallon","30 Gallon","55 Gallon Drum"] : ["Each","Pack of 12","Case"]; }
function szRow(r){
  return `<div class="szrow">
    <input type="text" data-sz="size" value="${escA(r.size||"")}" placeholder="e.g. 5 Gallon">
    <div class="in"><span>$</span><input data-sz="w" inputmode="decimal" value="${r.wholesale_cents!=null?(r.wholesale_cents/100).toFixed(2):""}" placeholder="wholesale"></div>
    <div class="in"><span>$</span><input data-sz="r" inputmode="decimal" value="${r.retail_cents!=null?(r.retail_cents/100).toFixed(2):""}" placeholder="retail"></div>
    <div class="in"><input data-sz="wt" inputmode="decimal" value="${r.weight_lb!=null?r.weight_lb:""}" placeholder="lb" style="width:64px;min-width:64px"><span style="color:#8aa0af">lb</span></div>
    <label class="tog"><input type="checkbox" data-sz="stock" ${r.in_stock===false?"":"checked"}> In stock</label>
    <button type="button" class="del" title="Remove size">✕</button>
  </div>`;
}
function bindSizeEditor(scope){
  scope.querySelectorAll("[data-addsz]").forEach(b=>b.onclick=()=>{
    const rows=b.closest(".szbox").querySelector(".szrows");
    const size=b.dataset.addsz;
    if(size && [...rows.querySelectorAll('[data-sz="size"]')].some(i=>i.value.trim().toLowerCase()===size.toLowerCase())) return;
    rows.insertAdjacentHTML("beforeend", szRow({size, in_stock:true}));
    rows.lastElementChild.querySelector(".del").onclick=function(){ this.closest(".szrow").remove(); }.bind(rows.lastElementChild.querySelector(".del"));
    if(!size) rows.lastElementChild.querySelector('[data-sz="size"]').focus();
  });
  scope.querySelectorAll(".szrow .del").forEach(b=>b.onclick=()=>b.closest(".szrow").remove());
}
async function saveSizes(row, id){
  const rows=[...row.querySelectorAll(".szrow")];
  const seen=new Set(); const ups=[]; let bad=null;
  rows.forEach(rw=>{
    const size=rw.querySelector('[data-sz="size"]').value.trim();
    if(!size) return;
    if(seen.has(size.toLowerCase())){ bad="Duplicate size: "+size; return; }
    seen.add(size.toLowerCase());
    const w=rw.querySelector('[data-sz="w"]').value.trim();
    const r=rw.querySelector('[data-sz="r"]').value.trim();
    const wt=rw.querySelector('[data-sz="wt"]').value.trim();
    ups.push({ product_id:id, size,
      wholesale_cents: w===""?null:moneyCents(w),
      retail_cents: r===""?null:moneyCents(r),
      weight_lb: wt===""?null:(parseFloat(wt.replace(/[^0-9.]/g,""))||null),
      in_stock: rw.querySelector('[data-sz="stock"]').checked });
  });
  if(bad) return { error:{ message:bad } };
  const { error:de } = await sb.from("size_prices").delete().eq("product_id",id);
  if(de) return { error:de };
  if(ups.length){
    const { error:ie } = await sb.from("size_prices").insert(ups);
    if(ie) return { error:ie };
  }
  const p=PRODUCTS.find(x=>x.id===id); if(p) p.size_prices=ups;
  return { error:null };
}

async function loadProducts(){
  const { data, error } = await sb.from("products")
    .select("id,slug,sku,upc,ship_restricted,name_en,name_es,desc_en,desc_es,active,sort_order,image_url,category_id,product_prices(price_cents,unit,min_order_qty,in_stock,currency),product_retail(retail_cents,in_stock),size_prices(size,wholesale_cents,retail_cents,weight_lb,in_stock)")
    .order("sort_order");
  if(error){ $("#prodList").innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
  PRODUCTS = data||[];
  $("#prodCount").textContent = PRODUCTS.length+" products";
  renderProducts("");
}
function renderProducts(q){
  q=(q||"").toLowerCase();
  const list = PRODUCTS.filter(p=> !q || (p.name_en||"").toLowerCase().includes(q) || (p.name_es||"").toLowerCase().includes(q) || (p.sku||"").toLowerCase().includes(q));
  if(!list.length){ $("#prodList").innerHTML=`<p class="muted">No matches.</p>`; return; }
  $("#prodList").innerHTML = list.map(p=>{
    const pr=priceOf(p); const dollars = pr ? (pr.price_cents/100).toFixed(2) : "";
    const rt=retailOf(p); const rdollars = rt ? (rt.retail_cents/100).toFixed(2) : "";
    return `<div class="prod" data-id="${p.id}">
      <div class="thbox">
        ${p.image_url?`<img class="th" src="${escA(p.image_url)}" loading="lazy" onerror="this.outerHTML='<div class=noimg>image missing</div>'">`:`<div class="noimg">no image</div>`}
        <span class="upl" data-uplbtn>Upload image</span>
        <input type="file" accept="image/*" data-uplfile>
      </div>
      <div>
        <label>Name (EN)</label><input class="pin" data-f="name_en" value="${escA(p.name_en)}">
        <label>Name (ES)</label><input class="pin" data-f="name_es" value="${escA(p.name_es)}">
        <label>Description (EN)</label><textarea class="pin" data-f="desc_en">${esc(p.desc_en)}</textarea>
        <label>Description (ES)</label><textarea class="pin" data-f="desc_es">${esc(p.desc_es)}</textarea>
        <div class="meta">${esc(p.sku||"no SKU")} · ${esc(p.slug)}</div>
      </div>
      <div>
        <label>Wholesale price</label><div class="in"><span>$</span><input class="pin sm" data-f="price" value="${dollars}"></div>
        <label>Retail price</label><div class="in"><span>$</span><input class="pin sm" data-f="retail" value="${rdollars}"></div>
        <label>Unit</label><input class="pin" data-f="unit" value="${escA(pr?pr.unit:"")}">
        <label>Min order qty</label><input class="pin sm" data-f="moq" value="${escA(pr?pr.min_order_qty:"")}">
        <label>UPC / barcode <span style="text-transform:none;letter-spacing:0;color:#8aa0af">(for Google Merchant)</span></label><input class="pin" data-f="upc" inputmode="numeric" placeholder="12-digit UPC" value="${escA(p.upc||"")}">
      </div>
      <div class="szfull">
        <div class="szbox">
          <h4>Container sizes &amp; prices</h4>
          <div class="szhead"><b>Size</b><b>Wholesale $</b><b>Retail $</b><b>Ship weight</b></div>
          <div class="szrows">${(Array.isArray(p.size_prices)?p.size_prices:(p.size_prices?[p.size_prices]:[])).sort((a,b)=>gal(a.size)-gal(b.size)).map(szRow).join("")}</div>
          <div class="szadd">${szChips(p).map(z=>`<button type="button" data-addsz="${escA(z)}">+ ${esc(z)}</button>`).join("")}<button type="button" data-addsz="">+ Custom size</button></div>
        </div>
      </div>
      <div class="act">
        <label class="tog"><input type="checkbox" data-f="active" ${p.active?"checked":""}> Active</label>
        <label class="tog"><input type="checkbox" data-f="in_stock" ${(!pr||pr.in_stock)?"checked":""}> In stock</label>
        <label class="tog" title="Solvent/hazmat items that can only ship locally or by ground freight"><input type="checkbox" data-f="restricted" ${p.ship_restricted?"checked":""}> Restricted shipping</label>
        <button class="btn amber" data-save>Save</button>
      </div>
    </div>`;
  }).join("");
  document.querySelectorAll("#prodList [data-save]").forEach(btn=>btn.onclick=()=>saveProduct(btn.closest(".prod")));
  document.querySelectorAll("#prodList [data-uplbtn]").forEach(s=>s.onclick=()=>s.closest(".thbox").querySelector("[data-uplfile]").click());
  document.querySelectorAll("#prodList [data-uplfile]").forEach(inp=>inp.onchange=()=>{ if(inp.files&&inp.files[0]) uploadImage(inp.closest(".prod"), inp.files[0]); });
  bindSizeEditor(document.getElementById("prodList"));
}
function moneyCents(v){ const n=parseFloat(String(v).replace(/[^0-9.]/g,"")); return isNaN(n)?null:Math.round(n*100); }
async function saveProduct(row){
  const id=row.dataset.id, g=(f)=>row.querySelector(`[data-f="${f}"]`);
  const btn=row.querySelector("[data-save]"); btn.disabled=true; btn.textContent="Saving…";
  const upcRaw=(g("upc")?g("upc").value:"").replace(/[^0-9]/g,"");
  if(upcRaw && (upcRaw.length<8 || upcRaw.length>14)){ btn.disabled=false; btn.textContent="Save"; showErr("UPC must be 8\u201314 digits (usually 12). You typed "+upcRaw.length+"."); return; }
  const pUpd={ name_en:g("name_en").value.trim(), name_es:g("name_es").value.trim(), desc_en:g("desc_en").value.trim(), desc_es:g("desc_es").value.trim(), active:g("active").checked, upc: upcRaw||null, ship_restricted: g("restricted")?g("restricted").checked:false };
  const r1=await sb.from("products").update(pUpd).eq("id",id);
  let r2={error:null}; const priceEl=g("price");
  if(priceEl && priceEl.value.trim()!==""){
    const cents=moneyCents(priceEl.value);
    if(cents===null){ btn.disabled=false; btn.textContent="Save"; showErr("Wholesale price \u201C"+priceEl.value+"\u201D is not a number \u2014 use digits like 24.50"); return; }
    r2=await sb.from("product_prices").upsert({ product_id:id, price_cents:cents, currency:"usd", unit:g("unit").value.trim()||null, min_order_qty:parseInt(g("moq").value||"1",10)||1, in_stock:g("in_stock").checked }, { onConflict:"product_id" });
  }
  let r3={error:null}; const retEl=g("retail");
  if(retEl && retEl.value.trim()!==""){
    const rcents=moneyCents(retEl.value);
    if(rcents===null){ btn.disabled=false; btn.textContent="Save"; showErr("Retail price \u201C"+retEl.value+"\u201D is not a number \u2014 use digits like 24.50"); return; }
    r3=await sb.from("product_retail").upsert({ product_id:id, retail_cents:rcents, in_stock:g("in_stock").checked }, { onConflict:"product_id" });
  }
  const r4=await saveSizes(row, id);
  btn.disabled=false; btn.textContent="Save";
  if(r1.error||r2.error||r3.error||r4.error){ showErr((r1.error||r2.error||r3.error||r4.error).message); return; }
  const unpriced=[...row.querySelectorAll(".szrow")].filter(rw=>rw.querySelector('[data-sz="size"]').value.trim() && rw.querySelector('[data-sz="r"]').value.trim()==="");
  if(unpriced.length){
    unpriced.forEach(rw=>{ rw.querySelector('[data-sz="r"]').style.border="2px solid #a12626"; });
    const m=$("#amsg"); m.className="msg err";
    m.textContent="Saved — but "+unpriced.length+" size(s) have no RETAIL price, so they will NOT appear on the website shop. Type a price in the red box and Save again.";
    setTimeout(()=>{ if(m.className.includes("err")) m.className="msg"; },9000);
    return;
  }
  const p=PRODUCTS.find(x=>x.id===id);
  if(p){ Object.assign(p,pUpd);
    if(priceEl && priceEl.value.trim()!==""){ let pr2=priceOf(p); if(!pr2){ pr2={}; p.product_prices=pr2; } pr2.price_cents=moneyCents(priceEl.value)||0; pr2.unit=g("unit").value.trim(); pr2.min_order_qty=parseInt(g("moq").value||"1",10)||1; pr2.in_stock=g("in_stock").checked; }
    if(retEl && retEl.value.trim()!==""){ let ro=retailOf(p); if(!ro){ ro={}; p.product_retail=ro; } ro.retail_cents=moneyCents(retEl.value)||0; ro.in_stock=g("in_stock").checked; } }
  const m=$("#amsg"); m.className="msg ok"; m.textContent=`Saved “${pUpd.name_en}”.`; setTimeout(()=>{ if(m.className.includes("ok")) m.className="msg"; },3000);
}
document.addEventListener("input",(e)=>{ if(e.target && e.target.id==="prodSearch") renderProducts(e.target.value); });

async function uploadImage(row, file){
  const id=row.dataset.id, btn=row.querySelector("[data-uplbtn]");
  if(file.size > 8*1024*1024){ showErr("Image is over 8 MB — please use a smaller file."); return; }
  btn.textContent="Uploading…";
  const clean=(file.name||"img").toLowerCase().replace(/[^a-z0-9.]+/g,"-").replace(/^-+|-+$/g,"");
  const path=`uploads/${Date.now()}-${clean}`;
  const { error:upErr } = await sb.storage.from("product-images").upload(path, file, { cacheControl:"31536000", contentType:file.type||"image/jpeg" });
  if(upErr){ btn.textContent="Upload image"; showErr(upErr.message); return; }
  const url = sb.storage.from("product-images").getPublicUrl(path).data.publicUrl;
  const { error:dbErr } = await sb.from("products").update({ image_url:url }).eq("id",id);
  btn.textContent="Upload image";
  if(dbErr){ showErr(dbErr.message); return; }
  const p=PRODUCTS.find(x=>x.id===id); if(p) p.image_url=url;
  renderProducts($("#prodSearch").value);
  const m=$("#amsg"); m.className="msg ok"; m.textContent="Image updated."; setTimeout(()=>{ if(m.className.includes("ok")) m.className="msg"; },3000);
}

let CATS=[];
async function loadCats(){
  const { data } = await sb.from("categories").select("id,name_en").order("sort");
  CATS = data||[];
  $("#np_cat").innerHTML = CATS.map(c=>`<option value="${escA(c.id)}">${esc(c.name_en)}</option>`).join("");
}
$("#newProdBtn").onclick=()=>{ $("#newProd").style.display = $("#newProd").style.display==="block"?"none":"block"; if(!CATS.length) loadCats(); };
$("#np_cancel").onclick=()=>{ $("#newProd").style.display="none"; };
$("#np_create").onclick=async ()=>{
  const name=$("#np_name_en").value.trim();
  if(!name){ showErr("Name (EN) is required."); return; }
  const b=$("#np_create"); b.disabled=true; b.textContent="Creating…";
  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") + "-" + Math.random().toString(36).slice(2,6);
  const maxSort = PRODUCTS.reduce((m,p)=>Math.max(m, p.sort_order||0), 0);
  const { data:ins, error:e1 } = await sb.from("products").insert({
    slug, sku:$("#np_sku").value.trim()||null, name_en:name, name_es:$("#np_name_es").value.trim()||name,
    category_id:$("#np_cat").value||null, active:true, sort_order:maxSort+1
  }).select("id").single();
  if(e1){ b.disabled=false; b.textContent="Create product"; showErr(e1.message); return; }
  const cents=Math.round(parseFloat($("#np_price").value||"0")*100);
  const { error:e2 } = await sb.from("product_prices").insert({
    product_id:ins.id, price_cents:isNaN(cents)?0:cents, currency:"usd",
    unit:$("#np_unit").value.trim()||"Each", min_order_qty:parseInt($("#np_moq").value||"1",10)||1, in_stock:true
  });
  const rcents=Math.round(parseFloat($("#np_retail").value||"0")*100);
  const { error:e3 } = await sb.from("product_retail").insert({ product_id:ins.id, retail_cents:isNaN(rcents)?0:rcents, in_stock:true });
  b.disabled=false; b.textContent="Create product";
  if(e2||e3){ showErr("Product created but a price failed: "+((e2||e3).message)); }
  ["np_name_en","np_name_es","np_sku","np_price","np_retail","np_unit"].forEach(i=>$("#"+i).value="");
  $("#np_moq").value="1"; $("#newProd").style.display="none";
  await loadProducts();
  $("#prodSearch").value=name; renderProducts(name);
  const m=$("#amsg"); m.className="msg ok"; m.textContent=`Created “${name}” — upload its image below.`; setTimeout(()=>{ if(m.className.includes("ok")) m.className="msg"; },5000);
};

function showErr(t){ const m=$("#amsg"); m.className="msg err"; m.textContent=t; }
boot();
</script>
